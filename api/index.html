<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão da Igreja - IA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    textarea { width: 95%; height: 100px; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 5px;}
    button { background: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
    button:hover { background: #004494; }
    #resposta { margin-top: 20px; text-align: left; white-space: pre-wrap; background: #eef; padding: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Assistente Pastoral (IA)</h2>
    <textarea id="pergunta" placeholder="Ex: Crie um cronograma para o culto de domingo..."></textarea><br>
    <button onclick="perguntar()">Perguntar à IA</button>
    <div id="resposta">A resposta da IA aparecerá aqui...</div>
  </div>
  <script>
    async function perguntar() {
      const pergunta = document.getElementById('pergunta').value;
      const respostaDiv = document.getElementById('resposta');
      respostaDiv.innerText = "Processando resposta, aguarde...";
      
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: pergunta })
      });
      
      const data = await res.json();
      respostaDiv.innerText = data.text || 'Erro ao processar.';
    }
  </script>
</body>
</html>
